# Lance l'agent + sa base PostgreSQL.
#   docker compose up --build
# Les valeurs viennent du fichier .env (copier .env.example en .env).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-agent_stock_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
    volumes:
      - agent_stock_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-agent_stock_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  agent:
    build: .
    env_file: .env
    environment:
      DB_HOST: db            # dans Docker, la base s'appelle "db" (et non localhost)
      DB_PORT: "5432"
      # Noyau lancé sur la machine hôte (port 8000) :
      NOYAU_URL: ${NOYAU_URL_DOCKER:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # nécessaire sous Linux
    ports:
      - "9001:9001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  agent_stock_data:
